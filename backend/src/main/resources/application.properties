# ===================================================================
# Smart Campus Infrastructure Problem Reporter
# Backend Spring Boot Configuration
# ===================================================================

# Application & Server Port
spring.application.name=campus-reporter-backend
server.port=8080

# ===================================================================
# Database Connection (PostgreSQL on port 1234, database campus_reporter_new)
# ===================================================================
# Values are read from environment variables (DB_URL, DB_USERNAME, DB_PASSWORD)
# or an untracked local properties file. Defaults do not hardcode any password.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:1234/campus_reporter_new}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Spring Data JPA / Hibernate
# ===================================================================
# Dialect is auto-detected by Hibernate from the PostgreSQL connection.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Optional Local Configuration Overrides
# Reads application-local.properties if present for local development
# ===================================================================
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# ===================================================================
# Multipart File Upload & Tomcat Connection Settings
# Supports 1-5 proof images up to 10MB each (max request 50MB)
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-part-count=50
